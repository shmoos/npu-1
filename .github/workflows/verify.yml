name: NPU-1 local validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Pin simulator, synthesis frontend, solvers, and formal runner together.
      - uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df
        with:
          version: '2026-10-29'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: make regression
      - run: make formal
      - run: make host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-verification-${{ matrix.os }}
          path: |
            reports/
            artifacts/verification/
            artifacts/formal/
            artifacts/demo-smoke/
