name: NPU-1 local validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y verilator build-essential
      - if: runner.os == 'macOS'
        run: brew install verilator
      - run: python -m pip install -r requirements.lock.txt
      - run: make regression
      - run: make host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-verification-${{ matrix.os }}
          path: |
            reports/
            artifacts/verification/
